# Compose auto-loads a `.env` file in this directory for ${VAR} substitution,
# so the defaults below let `docker compose up` work even before you create one.
# Copy .env.example to .env to override (and to set FIRMS_MAP_KEY in Phase 2).

# Shared app env — `web` (serves the map) and `scheduler` (hourly ingest) need
# the same DB creds + secrets, so define them once here to avoid drift.
x-app-env: &app-env
  POSTGRES_DB: ${POSTGRES_DB:-watchtower}
  POSTGRES_USER: ${POSTGRES_USER:-watchtower}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchtower}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchtower}
      POSTGRES_USER: ${POSTGRES_USER:-watchtower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchtower}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchtower} -d ${POSTGRES_DB:-watchtower}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # One-shot bootstrap (migrate → seed → optional demo admin), then exit 0. Both
  # `web` and `scheduler` wait on it (service_completed_successfully) so neither
  # touches the DB before the schema + seed data exist — and it runs exactly once
  # instead of racing from two services. The step sequence lives in
  # scripts/bootstrap.sh, shared with the prod stack so the two can't drift.
  init:
    build: .
    command: sh scripts/bootstrap.sh
    volumes:
      - .:/app
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  # Data refresh: compute missing viewsheds once on start, then loop the hourly
  # ingest cycle. The step sequence lives in scripts/scheduler.sh, shared with the
  # prod stack so the two can't drift (skipping viewsheds in dev was exactly such
  # a drift bug). See that script for the per-step rationale.
  scheduler:
    build: .
    command: sh scripts/scheduler.sh
    volumes:
      - .:/app
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
