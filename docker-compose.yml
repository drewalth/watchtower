# Compose auto-loads a `.env` file in this directory for ${VAR} substitution,
# so the defaults below let `docker compose up` work even before you create one.
# Copy .env.example to .env to override (and to set FIRMS_MAP_KEY in Phase 2).

# Shared app env — `web` (serves the map) and `scheduler` (hourly ingest) need
# the same DB creds + secrets, so define them once here to avoid drift.
x-app-env: &app-env
  POSTGRES_DB: ${POSTGRES_DB:-watchtower}
  POSTGRES_USER: ${POSTGRES_USER:-watchtower}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchtower}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchtower}
      POSTGRES_USER: ${POSTGRES_USER:-watchtower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchtower}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchtower} -d ${POSTGRES_DB:-watchtower}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy

  # Hourly data refresh. Reuses the `web` image (GDAL et al. already baked in)
  # and loops ingest → sleep 1h. Runs once immediately on start so a fresh
  # `docker compose up` populates data right away. Each step is idempotent and
  # guarded with `|| true` so one failure (missing key, un-seeded DB, FIRMS/
  # Open-Meteo hiccup) never kills the loop — errors still show in the logs.
  #   • ingest_fires --day-range 2 : rolling 48h FIRMS window
  #   • ingest_weather             : daily FWI inputs per tower (Open-Meteo)
  #   • compute_fire_risk          : recompute risk from the freshest weather
  scheduler:
    build: .
    command: >
      sh -c 'while true; do
        python manage.py ingest_fires --day-range 2 || true;
        python manage.py ingest_weather || true;
        python manage.py compute_fire_risk || true;
        sleep 3600;
      done'
    volumes:
      - .:/app
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
