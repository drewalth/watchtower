[project]
name = "watchtower"
version = "0.1.0"
description = "GeoDjango + PostGIS web map of wildfire lookout cameras and the active fires they can see."
requires-python = ">=3.12"
dependencies = [
    # Phase 0 — core framework + spatial DB driver.
    "django~=5.1",
    "psycopg[binary]~=3.2",
    # Phase 2 — FIRMS ETL: HTTP fetch + CSV parsing.
    "requests~=2.32",
    "pandas~=2.2",
    # Phase 3 — viewshed: read DEM rasters + polygonize the visible area.
    "rasterio~=1.4",
    "shapely~=2.0",
    "django-browser-reload>=1.21.0",
    "django-vite>=3.1.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
# Installed by default with `uv sync`; pass --no-dev to skip in production.
dev = [
    "pytest~=8.3",
    "pytest-django~=4.9",
    "ruff>=0.15.17",
]

[tool.uv]
# This is a Django application, not a distributable package, so uv shouldn't
# try to build/install it — just manage the environment.
package = false
