{% load django_vite %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchtower — fire lookouts</title>

  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || ((!t || t === "system") &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>

  {# Dev-only: React Fast Refresh runtime + Vite HMR client (no-ops in prod). #}
  {% vite_react_refresh %}
  {% vite_hmr_client %}
</head>
<body>
  {# The React app (assets/main.tsx) mounts here. #}
  <div id="root"></div>
  {% vite_asset 'assets/main.tsx' %}
</body>
</html>
