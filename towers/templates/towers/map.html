<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchtower — fire lookouts</title>

  <!-- Leaflet via CDN; no build step. -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <style>
    html, body { margin: 0; height: 100%; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // Center on California; fitBounds adjusts once towers load.
    const map = L.map("map").setView([38.5, -120.5], 6);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    fetch("{% url 'towers-geojson' %}")
      .then((response) => response.json())
      .then((geojson) => {
        const layer = L.geoJSON(geojson, {
          onEachFeature: (feature, lyr) => {
            const p = feature.properties;
            lyr.bindPopup(
              `<strong>${p.name}</strong><br>` +
              `Elevation: ${p.elevation_m} m<br>` +
              `Coverage radius: ${p.coverage_radius_km} km`
            );
          },
        }).addTo(map);

        if (geojson.features.length) {
          map.fitBounds(layer.getBounds().pad(0.2));
        }
      });
  </script>
</body>
</html>
